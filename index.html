<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PunganurEats — Food Delivery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
:root{--pink:#e23744;--dark:#1c1c1c;--gold:#ffb703}
body{background:#f8f8f8;color:#3d3d3d;padding-bottom:90px}
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1c1c1c,#2b0a0e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
#gate .logo{font-size:3rem;animation:float3d 3s ease-in-out infinite}
@keyframes float3d{0%,100%{transform:rotateY(-15deg) translateY(0)}50%{transform:rotateY(15deg) translateY(-12px)}}
#gate h1{color:#fff;font-size:1.8rem;margin:10px 0 5px}
#gate h1 span{color:var(--pink)}
#gate p{color:#bbb;margin-bottom:20px}
#nameIn{padding:14px 20px;border-radius:30px;border:2px solid var(--pink);background:#fff;width:280px;text-align:center;font-size:1rem;outline:none}
.gbtn{margin-top:18px;padding:14px 40px;border:none;border-radius:30px;background:linear-gradient(135deg,var(--pink),#ff6b35);color:#fff;font-weight:bold;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 25px #e2374466;animation:pulse 2s infinite}
.gbtn:active{transform:scale(.95)}
@keyframes pulse{0%,100%{box-shadow:0 8px 25px #e2374466}50%{box-shadow:0 8px 35px #e23744aa}}
header{background:linear-gradient(135deg,var(--pink),#ff6b35);padding:14px 16px;color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 4px 15px #0003}
.hrow{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:auto}
.hrow h2{font-size:1.25rem}
.cartB{background:#fff;color:var(--pink);border:none;border-radius:25px;padding:8px 18px;font-weight:bold;cursor:pointer;position:relative}
#cc{background:var(--dark);color:#fff;border-radius:50%;padding:1px 7px;font-size:.75rem;position:absolute;top:-8px;right:-8px}
.search{max-width:1000px;margin:12px auto 0;display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px #0002}
.search input{flex:1;padding:12px 15px;border:none;outline:none;font-size:.95rem}
.search button{border:none;background:var(--pink);color:#fff;padding:0 20px;font-size:1rem;cursor:pointer}
.banner{max-width:1000px;margin:16px auto 0;padding:0 16px}
.banner .inner{background:linear-gradient(120deg,#1c1c1c,#3d0c11);border-radius:16px;padding:18px;color:#fff;display:flex;align-items:center;gap:15px;box-shadow:0 10px 25px #0004;animation:bannerIn .8s ease}
.banner .inner b{color:var(--gold);font-size:1.2rem}
@keyframes bannerIn{from{opacity:0;transform:rotateX(25deg) translateY(40px)}to{opacity:1;transform:rotateX(0) translateY(0)}}
.cats{max-width:1000px;margin:20px auto 0;padding:0 16px;display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.cat{flex:0 0 auto;background:#fff;border-radius:14px;padding:12px 18px;text-align:center;cursor:pointer;box-shadow:0 3px 10px #0001;transition:.25s;border:2px solid transparent}
.cat:hover{transform:translateY(-6px) rotateX(8deg);border-color:var(--pink);box-shadow:0 12px 20px #e2374433}
.cat .e{font-size:1.8rem}
.cat div:last-child{font-size:.75rem;font-weight:bold;margin-top:4px}
.wrap{max-width:1000px;margin:auto;padding:0 16px}
.secT{margin:25px 0 12px;font-size:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;perspective:1000px}
.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 15px #0001;transition:transform .3s,box-shadow .3s;transform-style:preserve-3d;animation:cardIn .6s ease both}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}.card:nth-child(4){animation-delay:.3s}.card:nth-child(5){animation-delay:.4s}
@keyframes cardIn{from{opacity:0;transform:rotateY(25deg) translateY(50px)}to{opacity:1;transform:rotateY(0) translateY(0)}}
.card:hover{transform:rotateY(-6deg) rotateX(6deg) translateY(-8px) scale(1.02);box-shadow:0 20px 40px #0003}
.cImg{height:130px;display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--g);position:relative}
.off{position:absolute;top:10px;left:10px;background:var(--pink);color:#fff;font-size:.7rem;font-weight:bold;padding:4px 10px;border-radius:20px;animation:spin3d 4s ease-in-out infinite}
@keyframes spin3d{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
.cb{padding:14px}
.cb h3{font-size:1.05rem}
.cui{color:#8a8a8a;font-size:.82rem;margin:3px 0}
.rrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.82rem}
.rate{background:#267e3e;color:#fff;padding:3px 8px;border-radius:8px;font-weight:bold}
.time{color:#8a8a8a}
#menuPage{display:none}
.back{background:#fff;border:1px solid #ddd;border-radius:25px;padding:8px 20px;cursor:pointer;margin:15px 0;font-weight:bold}
.mHero{height:160px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:5rem;background:var(--g);box-shadow:0 15px 30px #0003;animation:hero3d 1s ease}
@keyframes hero3d{from{transform:perspective(800px) rotateX(40deg) scale(.8);opacity:0}to{transform:perspective(800px) rotateX(0) scale(1);opacity:1}}
.foodGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:15px}
.food{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 10px #0001;transition:.25s;animation:pop .4s ease both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.food:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 12px 25px #0002}
.fE{font-size:2.8rem;text-align:center}
.food h4{margin:8px 0 3px;font-size:.95rem}
.price{font-weight:bold}
.veg{color:#267e3e;font-size:.72rem;font-weight:bold}
.nonveg{color:var(--pink);font-size:.72rem;font-weight:bold}
.addB{margin-top:8px;width:100%;padding:8px;border:none;border-radius:20px;background:var(--pink);color:#fff;font-weight:bold;cursor:pointer;transition:.2s}
.addB:hover{background:#c21f2c;transform:scale(1.05)}
.ci{display:flex;justify-content:space-between;align-items:center;background:#f8f8f8;border-radius:10px;padding:10px 12px;margin:7px 0}
.total{display:flex;justify-content:space-between;font-weight:bold;font-size:1.1rem;padding:12px 4px;border-top:2px dashed #ddd;margin-top:8px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:20px;max-height:85vh;overflow-y:auto;animation:zoom3d .35s ease}
@keyframes zoom3d{from{transform:perspective(600px) rotateX(-20deg) scale(.7);opacity:0}to{transform:perspective(600px) rotateX(0) scale(1);opacity:1}}
.x{float:right;background:#eee;border:none;width:30px;height:30px;border-radius:50%;font-size:1rem;cursor:pointer}
input.f{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:7px 0;font-size:.95rem;outline:none}
input.f:focus{border-color:var(--pink)}
.btnFull{width:100%;padding:13px;border:none;border-radius:25px;background:linear-gradient(135deg,var(--pink),#ff6b35);color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;margin-top:10px}
.ord{background:#f8f8f8;border-radius:10px;padding:10px;margin:8px 0;font-size:.83rem;border-left:4px solid var(--pink)}
#trackB{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 28px;border:none;border-radius:30px;font-weight:bold;cursor:pointer;box-shadow:0 8px 25px #0005;display:none;z-index:150;animation:pulse 2s infinite}
.rider{font-size:4rem;display:inline-block;animation:ride 2.5s ease-in-out infinite}
@keyframes ride{0%{transform:translateX(-60px) rotateY(-20deg)}50%{transform:translateX(60px) rotateY(20deg)}100%{transform:translateX(-60px) rotateY(-20deg)}}
.status{margin:14px 0;font-weight:bold;color:var(--pink)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#267e3e;color:#fff;padding:12px 25px;border-radius:30px;font-weight:bold;display:none;z-index:300;box-shadow:0 8px 20px #0004}
footer{background:var(--dark);color:#888;text-align:center;padding:25px;font-size:.8rem;margin-top:30px}
footer b{color:var(--pink)}
</style>
</head>
<body>

<div id="gate">
<div class="logo">🍛</div>
<h1>Punganur<span>Eats</span></h1>
<p>Delicious food from Punganur's best restaurants 🍽️</p>
<input id="nameIn" placeholder="What's your name?">
<button class="gbtn" onclick="enter()">Enter &amp; Dine 🌟</button>
</div>

<header><div class="hrow">
<h2>🍽️ Punganur<span style="color:var(--gold)">Eats</span></h2>
<button class="cartB" onclick="showCart()">🛒 Cart <span id="cc">0</span></button>
</div>
<div class="search"><input id="q" placeholder="Search restaurants or dishes..." oninput="render()"><button onclick="render()">🔍</button></div>
</header>

<div class="banner"><div class="inner"><span style="font-size:2rem">🎉</span><div><b>50% OFF</b> your first order — Use code <b>PUNGANUR50</b></div></div></div>

<div class="cats" id="cats"></div>

<div class="wrap">
<div id="homePage">
<h2 class="secT" id="greet">Restaurants near you</h2>
<div class="grid" id="resGrid"></div>
</div>
<div id="menuPage"></div>
</div>

<button id="trackB" onclick="track()">🛵 Track Order

<button id="trackB" onclick="track()">🛵 Track Order</button>

<!-- CART MODAL -->
<div class="modal" id="cartM"><div class="mbox">
<button class="x" onclick="hide('cartM')">✕</button>
<h3>🛒 Your Cart</h3><div id="cartItems"></div>
<div class="total"><span>Total</span><span id="totAmt">₹0</span></div>
<input class="f" id="ph" placeholder="📞 Phone number">
<input class="f" id="ad" placeholder="🏠 Delivery address">
<button class="btnFull" onclick="placeOrder()">✅ Place Order</button>
</div></div>

<!-- TRACK MODAL -->
<div class="modal" id="trackM"><div class="mbox">
<button class="x" onclick="hide('trackM')">✕</button>
<div class="trackBox">
<div class="rider">🛵</div>
<div class="status" id="st">Order Confirmed ✅</div>
<p style="color:#888;font-size:.85rem" id="eta"></p>
</div></div></div>

<!-- ADMIN MODAL -->
<div class="modal" id="adminM"><div class="mbox">
<button class="x" onclick="hide('adminM')">✕</button>
<h3>📋 All Orders</h3><div id="ordList"></div>
</div></div>

<div id="toast"></div>

<footer><b>PunganurEats</b> — Made with ❤️ in Punganur<br>Admin: <span style="cursor:pointer" onclick="admin()">Owner Login</span></footer>

<script>
var R=[
{n:"Dawath Biryani House",tag:"Biryani, North Indian",rate:"4.7",time:"30-35 min",g:"#ff4d4d",ic:"🍛",off:"50% OFF up to ₹100",items:[{n:"Chicken Dum Biryani",p:220,v:0,e:"🍛"},{n:"Mutton Biryani",p:280,v:0,e:"🍖"},{n:"Veg Biryani",p:160,v:1,e:"🍚"},{n:"Chicken 65",p:180,v:0,e:"🍗"},{n:"Double Ka Meetha",p:90,v:1,e:"🍮"}]},
{n:"Punganur Family Restaurant",tag:"Meals, Andhra",rate:"4.5",time:"25-30 min",g:"#11998e",ic:"🥘",off:"Free delivery above ₹199",items:[{n:"Andhra Veg Thali",p:150,v:1,e:"🍛"},{n:"Chicken Thali",p:190,v:0,e:"🍗"},{n:"Paneer Butter Masala",p:180,v:1,e:"🧈"},{n:"Sambar Rice",p:90,v:1,e:"🍲"},{n:"Fish Curry Meals",p:200,v:0,e:"🐟"}]},
{n:"Punganur Cafe",tag:"Cafe, Snacks, Burgers",rate:"4.4",time:"20-25 min",g:"#3f5efb",ic:"☕",off:"₹50 OFF above ₹249",items:[{n:"Filter Coffee",p:30,v:1,e:"☕"},{n:"Veg Burger",p:120,v:1,e:"🍔"},{n:"Chicken Burger",p:150,v:0,e:"🍔"},{n:"French Fries",p:70,v:1,e:"🍟"},{n:"Grilled Sandwich",p:80,v:1,e:"🥪"}]},
{n:"Sweet House Punganur",tag:"Desserts, Sweets",rate:"4.6",time:"20-30 min",g:"#f7971e",ic:"🍮",off:"20% OFF on all sweets",items:[{n:"Gulab Jamun (2pc)",p:80,v:1,e:"🍮"},{n:"Rasmalai (2pc)",p:100,v:1,e:"🍥"},{n:"Motichoor Ladoo",p:90,v:1,e:"🟠"},{n:"Badam Milk",p:45,v:1,e:"🥛"},{n:"Mysore Pak",p:110,v:1,e:"🍯"}]},
{n:"Sri Tiffin Center",tag:"South Indian, Tiffin",rate:"4.8",time:"15-20 min",g:"#0072ff",ic:"🥞",off:"Breakfast combo ₹99",items:[{n:"Ghee Kacha Dosa",p:70,v:1,e:"🥞"},{n:"Idli (2pc) Sambar",p:40,v:1,e:"⚪"},{n:"Medu Vada (2pc)",p:50,v:1,e:"🍩"},{n:"Puri Curry",p:55,v:1,e:"🌀"},{n:"Upma Pesarattu",p:60,v:1,e:"🫓"}]}
];
var CATS=[{e:"🍛",n:"Biryani",f:"Biryani"},{e:"🥘",n:"Meals",f:"Meals"},{e:"☕",n:"Cafe",f:"Cafe"},{e:"🍮",n:"Sweets",f:"Sweets"},{e:"🥞",n:"Tiffin",f:"Tiffin"},{e:"🍗",n:"Chicken",f:"Chicken"}];
var cart=[],user="",activeCat="All";
function $(i){return document.getElementById(i)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2200)}
function hide(i){$(i).classList.remove("on")}

function enter(){
user=$("nameIn").value.trim();
if(!user){toast("Please enter your name 😊");return}
$("gate").style.display="none";
$("greet").textContent="Hi "+user+" 👋 — Restaurants near you";
render();renderCats();
}
function renderCats(){
var h='<div class="cat" onclick="pickCat(\'All\')"><div class="e">🍽️</div><div>All</div></div>';
for(var i=0;i<CATS.length;i++){h+='<div class="cat" onclick="pickCat(\''+CATS[i].f+'\')"><div class="e">'+CATS[i].e+'</div><div>'+CATS[i].n+'</div></div>'}
$("cats").innerHTML=h;
}
function pickCat(f){activeCat=f;render()}
function render(){
var q=$("q").value.toLowerCase(),h="",n=0;
for(var i=0;i<R.length;i++){
var r=R[i];
if(activeCat!=="All"&&r.tag.toLowerCase().indexOf(activeCat.toLowerCase())<0)continue;
var match=!q||r.n.toLowerCase().indexOf(q)>=0||r.tag.toLowerCase().indexOf(q)>=0;
if(!match){for(var j=0;j<r.items.length;j++){if(r.items[j].n.toLowerCase().indexOf(q)>=0){match=true;break}}}
if(!match)continue;n++;
h+='<div class="card" onclick="openMenu('+i+')"><div class="cImg" style="--g:'+r.g+'">'+r.ic+'<div class="off">'+r.off+'</div></div><div class="cb"><h3>'+r.n+'</h3><div class="cui">'+r.tag+'</div><div class="rrow"><span class="rate">★ '+r.rate+'</span><span class="time">'+r.time+'</span></div></div></div>';
}
$("resGrid").innerHTML=n?h:"<p style='color:#888'>No restaurants found 😕 Try another search.</p>";
}
function openMenu(i){
var r=R[i];("homePage").style.display="none";varm=("homePage").style.display="none";var m=("homePage").style.display="none";varm=("menuPage");m.style.display="block";
var h='<button class="back" onclick="goHome()">← Back</button><div class="mHero" style="--g:'+r.g+'">'+r.ic+'</div><h2 style="margin:12px 0 2px">'+r.n+'</h2><div class="cui">'+r.tag+' • ★ '+r.rate+' • '+r.time+'</div><div style="background:#ffe3e3;color:var(--pink);padding:10px;border-radius:10px;font-weight:bold;margin:10px 0">🎉 '+r.off+'</div><div class="foodGrid">';
for(var j=0;j<r.items.length;j++){var it=r.items[j];
h+='<div class="food" style="animation-delay:'+(j*.08)+'s"><div class="fE">'+it.e+'</div><h4>'+it.n+'</h4><span class="'+(it.v?"veg">Non-Veg":"veg")+'">'+(it.v?"🟢 VEG":"🔴 NON-VEG")+'</span><div class="price">₹'+it.p+'</div><button class="addB" onclick="add('+i+','+j+',this)">ADD +</button></div>'}
m.innerHTML=h+"</div>";
window.scrollTo(0,0);
}
function goHome(){("menuPage").style.display="none";("menuPage").style.display="none";("menuPage").style.display="none";("homePage").style.display="block";window.scrollTo(0,0)}
function add(i,j,btn){
var it=R[i].items[j];
for(var k=0;k<cart.length;k++){if(cart[k].n===it.n){cart[k].q++;upd();toast("✅ +1 "+it.n);return}}
cart.push({n:it.n,p:it.p,e:it.e,q:1});upd();toast("✅ "+it.n+" added to cart!");
btn.textContent="ADDED ✓";setTimeout(function(){btn.textContent="ADD +"},900);
}
function upd(){
var c=0,t=0;for(var i=0;i<cart.length;i++){c+=cart[i].q;t+=cart[i].p*cart[i].q}
$("cc").textContent=c;cartTotal=t;
}
function showCart(){
if(!cart.length){toast("Cart is empty! Add some food 🍽️");return}
var h="",t=0;
for(var i=0;i<cart.length;i++){var c=cart[i];t+=c.p*c.q;
h+="<div class='ci'><span>"+c.e+" "+c.n+"</span><span><button class='addB' style='width:auto;padding:4px 12px;margin:0' onclick='qty("+i+",-1)'>−</button> "+c.q+" <button class='addB' style='width:auto;padding:4px 12px;margin:0' onclick='qty("+i+",1)'>+</button> <b>₹"+(c.p*c.q)+"</b></span></div>"}
("cartItems").innerHTML=h;("cartItems").innerHTML=h;("cartItems").innerHTML=h;("totAmt").textContent="₹"+t;$("cartM").classList.add("on");
}
var cartTotal=0;
function qty(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);upd();if(cart.length)showCart();else hide("cartM")}
function placeOrder(){
var ph=("ph").value.trim(),ad=("ph").value.trim(),ad=("ph").value.trim(),ad=("ad").value.trim();
if(!ph||!ad){toast("Enter phone & address 📞");return}
if(!/^[0-9]{10}$/.test(ph)){toast("Enter a valid 10-digit number");return}
var o={name:user,phone:ph,addr:ad,items:cart.map(function(c){return c.n+" x"+c.q}).join(", "),total:cartTotal,status:"Confirmed",time:new Date().toLocaleString()};
var os=JSON.parse(localStorage.getItem("punganurOrders")||"[]");os.push(o);
localStorage.setItem("punganurOrders",JSON.stringify(os));
cart=[];upd();hide("cartM");
$("trackB").style.display="block";
toast("🎉 Order placed! ₹"+cartTotal);
("ph").value="";("ph").value="";("ph").value="";("ad").value="";
}
function track(){
var stages=["Order Confirmed ✅","Restaurant is preparing your food 👨‍🍳","Rider picked up your order 🛵","Arriving at your location 📍"];
var s=0;("trackM").classList.add("on");("trackM").classList.add("on");("trackM").classList.add("on");("st").textContent=stages[0];$("eta").textContent="ETA: 25-30 minutes";
var iv=setInterval(function(){s++;if(s>=stages.length){clearInterval(iv);("st").textContent="Delivered!Enjoyyourmeal😋";("st").textContent="Delivered! Enjoy your meal 😋";("st").textContent="Delivered!Enjoyyourmeal😋";("trackB").style.display="none";return}$("st").textContent=stages[s]},4000);
}
function admin(){
var pw=prompt("Owner password:");
if(pw===null)return;
if(pw!=="punganur123"){toast("Wrong password ❌");return}
var os=JSON.parse(localStorage.getItem("punganurOrders")||"[]"),h="<p><b>"+os.length+"</b> total orders</p>";
if(!os.length)h+="<p>No orders yet.</p>";
for(var i=os.length-1;i>=0;i--){h+="<div class='ord'><b>"+os[i].name+"</b> • "+os[i].phone+"<br>📍 "+os[i].addr+"<br>🛒 "+os[i].items+"<br><b>₹"+os[i].total+"</b> — "+os[i].time+"</div>"}
("ordList").innerHTML=h;("ordList").innerHTML=h;("ordList").innerHTML=h;("adminM").classList.add("on");
}
$("nameIn").addEventListener("keydown",function(e){if(e.key==="Enter")enter()});
</script>
</body>
</html>
